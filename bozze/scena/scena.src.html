<title>Il Prato di Happy Little Sheeps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Scena unica, sempre di giorno sul prato: un solo aspetto voluto, niente tema scuro.
   La scena è disegnata in un riquadro logico 390×844 (telefono in verticale) e scalata per stare nello schermo. */
:root {
  --notte: #23264A; --gesso: #FBFAF5; --nebbia: #E4E9F2; --menta: #9ED9C3; --lilla: #C4B3EE;
  --albicocca: #F7B98B; --limone: #F2E27A; --fango: #CDB08F; --celeste: #B5D6F2; --ombra-pulsante: #0E1030;
  --f-titoli: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-testo: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  color-scheme: light;
}
@property --cielo { syntax: '<color>'; inherits: true; initial-value: #B5D6F2; }
@property --orizzonte { syntax: '<color>'; inherits: true; initial-value: #E4E9F2; }
@property --prato { syntax: '<color>'; inherits: true; initial-value: #9ED9C3; }
@property --sole { syntax: '<color>'; inherits: true; initial-value: #F2E27A; }
@property --stelle { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --nuvola { syntax: '<color>'; inherits: true; initial-value: #FBFAF5; }

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #B5D6F2; }
body { font-family: var(--f-testo); color: var(--notte); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#schermo { position: relative; height: 100%; overflow: hidden; background: var(--cielo);
  --collina: color-mix(in srgb, var(--prato) 58%, var(--orizzonte));
  --pavimento: color-mix(in srgb, var(--fango) 42%, var(--prato));
  --sabbia: color-mix(in srgb, #F2E27A 48%, #CDB08F);
  --erba: color-mix(in srgb, var(--prato) 80%, var(--notte));
  transition: --cielo 2.6s, --orizzonte 2.6s, --prato 2.6s, --sole 2.6s, --stelle 2.6s, --nuvola 2.6s; }
#schermo.ora-giorno { --cielo: #B5D6F2; --orizzonte: #E4E9F2; --prato: #9ED9C3; --sole: #F2E27A; --stelle: 0; --nuvola: #FBFAF5; }
#schermo.ora-pomeriggio { --cielo: #B5D6F2; --orizzonte: #F2E27A; --prato: #9ED9C3; --sole: #F2E27A; --stelle: 0; --nuvola: #FBFAF5; }
#schermo.ora-tramonto { --cielo: #C4B3EE; --orizzonte: #F7B98B; --prato: color-mix(in srgb, #9ED9C3 84%, #F7B98B); --sole: #F7B98B; --stelle: 0; --nuvola: color-mix(in srgb, #FBFAF5 75%, #F7B98B); }
#schermo.ora-sera { --cielo: color-mix(in srgb, #C4B3EE 58%, #23264A); --orizzonte: #C4B3EE; --prato: color-mix(in srgb, #9ED9C3 76%, #23264A); --sole: #F7B98B; --stelle: 1; --nuvola: color-mix(in srgb, #FBFAF5 70%, #C4B3EE); }
/* Temporale (eventi meteo): vince sull'ora del giorno finché dura */
#schermo.tempesta { --cielo: color-mix(in srgb, #C4B3EE 50%, #23264A); --orizzonte: color-mix(in srgb, #E4E9F2 65%, #C4B3EE); --prato: color-mix(in srgb, #9ED9C3 80%, #23264A); --nuvola: color-mix(in srgb, #E4E9F2 72%, #23264A); }

#scena { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
#camera { position: absolute; inset: 0; transform-origin: 0 0; }
#mondo { position: absolute; inset: 0; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#hud, #eventi, #azioni-carta, #lettura, #finale { pointer-events: auto; }
#consiglio { pointer-events: none; }
.abs { position: absolute; }

/* Cielo e paesaggio: fasce piatte che vanno oltre i bordi del riquadro, così lo schermo largo resta pieno */
#cielo { position: absolute; left: -1400px; top: -2400px; width: 3190px; height: 2560px; background: var(--cielo); }
#fascia { display: none; } /* cielo di un solo colore: niente fascia sull orizzonte */
#cielo-svg, #nuvole-svg, #paesaggio, #flora { position: absolute; left: 0; top: 0; overflow: visible; }
#stelle { opacity: var(--stelle); }
/* Quando una nuvola copre il sole il prato si scurisce appena; le ombre sotto le cose seguono il sole */
#penombra { position: absolute; left: -1400px; top: -600px; width: 3190px; height: 1700px; background: var(--notte); opacity: 0; pointer-events: none; z-index: 1950; }
.ombra-recinto { fill: var(--notte); opacity: var(--oop, .15); }

/* Pecore */
.pecora { position: absolute; transform-origin: 50% 92%; }
.pecora .reazione { transform-origin: 50% 92%; }
.pecora svg { display: block; width: 100%; height: auto; overflow: visible; }
.targa { position: absolute; transform: translateX(-50%); white-space: nowrap; font: 800 11px/1 var(--f-titoli); letter-spacing: .08em; text-transform: uppercase;
  background: var(--gesso); border: 2px solid var(--notte); border-radius: 999px; padding: 4px 9px 3px; }
.targa.turno { background: var(--limone); }
.ventaglio { position: absolute; width: 0; height: 0; }
.ventaglio i { position: absolute; left: -11px; top: -29px; width: 22px; height: 31px; transform-origin: 50% 115%; }
/* Il tappetino davanti a ogni avversario: lì stanno le sue carte coperte e i suoi Guai, su un fondo pulito */
.tappetino { position: absolute; background: var(--gesso); border: 2px solid var(--notte); border-radius: 12px; box-shadow: 0 3px 0 rgba(35,38,74,.18); z-index: 290; }
.ventaglio svg, .mini svg { display: block; width: 100%; height: 100%; }
.mini { position: absolute; transform-origin: 50% 100%; }

/* Recinti */
.recinto { position: absolute; overflow: visible; pointer-events: none; }
.cartello { position: absolute; transform: translateX(-50%); font: 800 14px/1 var(--f-titoli); font-variant-numeric: tabular-nums; background: var(--fango);
  border: 2.5px solid var(--notte); border-radius: 6px; padding: 5px 8px 4px; white-space: nowrap; }
.cartello.piccolo { font-size: 10px; padding: 3px 5px 2px; border-width: 2px; }
.cartello.quasi { background: var(--limone); }

/* Agnellini */
.agn { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.agn svg.ombra { position: absolute; left: -14px; top: -25.8px; width: 28px; height: 28px; transform-origin: 14px 25.8px; filter: brightness(0); opacity: var(--oop, .15); pointer-events: none; }
.agn .corpo { position: absolute; left: 0; top: 0; width: 28px; height: 28px; transform-origin: 14px 25.8px; cursor: pointer; }
.agn svg { display: block; width: 28px; height: 28px; overflow: visible; }
/* Meteo */
.pozza, .saetta { position: absolute; overflow: visible; pointer-events: none; }
.saetta { left: 0; top: 0; z-index: 3200; }
.pozza .cerchio { transform-box: fill-box; transform-origin: 50% 50%; animation: increspa 1.8s ease-out infinite; }
.pozza .cerchio.due { animation-delay: -.9s; }
@keyframes increspa { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.pozza .occhi-lupo { transform-box: fill-box; transform-origin: 50% 50%; animation: an-palpebra 2.6s ease-in-out infinite; }
.lampo { position: absolute; left: -1400px; top: -600px; width: 3190px; height: 1700px; background: var(--gesso); z-index: 3250; pointer-events: none; opacity: 0; }
.gelo { position: absolute; left: -1400px; top: -600px; width: 3190px; height: 1700px; background: var(--celeste); z-index: 1940; pointer-events: none; opacity: 0; mix-blend-mode: multiply; }
#nebbia-svg { position: absolute; left: 0; top: 0; overflow: visible; z-index: 1900; pointer-events: none; opacity: .84; }
#flora path { transition: stroke .8s, opacity .8s, stroke-width .8s; }
#flora.ghiacciato path { stroke: var(--gesso); opacity: .95; stroke-width: 2.6; }
.pozza .mulinello { transform-box: view-box; transform-origin: 0 0; animation: mulinello 1.4s linear infinite; }
@keyframes mulinello { to { transform: rotate(-360deg); } }
.pozza .nuvoletta { transform-box: fill-box; transform-origin: 50% 50%; }
.agn .corpo svg.extra { position: absolute; left: 0; top: 0; pointer-events: none; }
[data-chi], .agn { transition: opacity .6s; }
.linee-zoom { position: absolute; overflow: visible; pointer-events: none; z-index: 2400; }
.terreno { position: absolute; overflow: visible; z-index: 290; pointer-events: none; }
#mano.ventoso .cm svg { transform-origin: 50% 100%; animation: svolazza .32s ease-in-out infinite alternate; }
@keyframes svolazza { from { transform: rotate(-2deg) skewX(-2deg); } to { transform: rotate(2.5deg) skewX(2deg); } }
/* Illustrazioni delle carte in primo piano */
.anima .an { transform-box: fill-box; transform-origin: 50% 50%; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.anima .an-germoglio { transform-origin: 50% 100%; animation-name: an-oscilla; animation-duration: 2.6s; }
.anima .an-luccica { animation-name: an-luccica; animation-duration: 2.2s; }
.anima .an-calza { transform-origin: 55% 4%; animation-name: an-oscilla-piccola; animation-duration: 1.9s; }
.anima .an-r2 { animation-delay: -1s; }
.anima .an-ondeggia { transform-origin: 50% 100%; animation-name: an-oscilla-piccola; animation-duration: 3s; }
.anima .an-gocce { animation-name: an-cade; animation-duration: 1.3s; animation-timing-function: ease-in; }
.anima .an-campana { transform-origin: 50% 0%; animation-name: an-campana; animation-duration: 1.4s; }
.anima .an-batacchio { transform-origin: 50% -140%; animation-name: an-campana; animation-duration: 1.4s; animation-direction: reverse; }
.anima .an-onde { animation-name: an-onde; animation-duration: .7s; animation-timing-function: ease-out; }
.anima .an-urlo { animation-name: an-urlo; animation-duration: 1.6s; }
.anima .an-pop { transform-origin: 50% 80%; animation-name: an-pop; animation-duration: 2.4s; animation-timing-function: ease-out; }
.anima .an-tratteggio { animation-name: an-tratteggio; animation-duration: .8s; animation-timing-function: linear; }
.anima .an-zampe { transform-origin: 50% 100%; animation-name: an-zampe; animation-duration: 1.2s; }
.anima .an-stella { animation-name: an-stella; animation-duration: 2.2s; animation-timing-function: linear; }
.anima .an-nuvola { animation-name: an-galleggia; animation-duration: 3s; }
.anima .an-chicco { animation-name: an-chicco; animation-duration: 1.6s; animation-timing-function: cubic-bezier(.5,0,.8,.6); }
.anima .an-cespuglio { transform-origin: 50% 100%; animation-name: an-fruscia; animation-duration: 2.8s; }
.anima .an-occhi { animation-name: an-palpebra; animation-duration: 3.4s; }
.anima .an-pupille { animation-name: an-pupille; animation-duration: 3.4s; }
.anima .an-lampo { animation-name: an-lampo; animation-duration: 2.2s; animation-timing-function: steps(1); }
.anima .an-pioggia { animation-name: an-pioggia; animation-duration: .45s; animation-timing-function: linear; }
.anima .an-banco { animation-name: an-banco; animation-duration: 4s; }
.anima .an-vortice { animation-name: an-vortice; animation-duration: 1s; animation-timing-function: linear; }
.anima .an-ciuffo { animation-name: an-ciuffo; animation-duration: 1.8s; }
.anima .an-ruota { animation-name: an-ruota; animation-duration: 14s; animation-timing-function: linear; }
.anima .an-pulsa { animation-name: an-pulsa; animation-duration: 2s; }
.anima .an-increspa { animation-name: an-increspa; animation-duration: 2s; animation-timing-function: ease-out; }
@keyframes an-oscilla { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes an-oscilla-piccola { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes an-luccica { 0%, 55%, 100% { transform: scale(0) rotate(0); } 70% { transform: scale(1.2) rotate(45deg); } 85% { transform: scale(.9) rotate(80deg); } }
@keyframes an-cade { 0% { transform: translateY(-10px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(34px); opacity: 0; } }
@keyframes an-campana { 0%, 100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
@keyframes an-onde { 0% { transform: scale(.8); opacity: .2; } 45% { opacity: 1; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes an-urlo { 0%, 58%, 100% { transform: scale(1) rotate(0); } 64% { transform: scale(1.09) rotate(-2.5deg); } 70% { transform: scale(1.07) rotate(2.5deg); } 76% { transform: scale(1.08) rotate(-1.5deg); } 84% { transform: scale(1) rotate(0); } }
@keyframes an-pop { 0%, 30%, 100% { transform: scale(1); } 8% { transform: scale(1.14); } 16% { transform: scale(.95); } 22% { transform: scale(1.02); } }
@keyframes an-tratteggio { to { stroke-dashoffset: -12; } }
@keyframes an-zampe { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-7deg); } 80% { transform: rotate(6deg); } 90% { transform: rotate(-3deg); } }
@keyframes an-stella { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
@keyframes an-galleggia { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes an-chicco { 0% { transform: translateY(-48px); opacity: 0; } 15% { opacity: 1; } 68% { transform: translateY(0); } 78% { transform: translateY(-7px); } 88% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
@keyframes an-fruscia { 0%, 40%, 100% { transform: rotate(0); } 46% { transform: rotate(-2deg); } 52% { transform: rotate(2deg); } 58% { transform: rotate(-1deg); } 64% { transform: rotate(0); } }
@keyframes an-palpebra { 0%, 42%, 50%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
@keyframes an-pupille { 0%, 15% { transform: translateX(0); } 25%, 38% { transform: translateX(-4px); } 55%, 80% { transform: translateX(4px); } 92%, 100% { transform: translateX(0); } }
@keyframes an-lampo { 0%, 100% { opacity: 1; } 8% { opacity: .25; } 12% { opacity: 1; } 16% { opacity: .35; } 20% { opacity: 1; } }
@keyframes an-pioggia { to { stroke-dashoffset: -22; } }
@keyframes an-banco { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(12px); } }
@keyframes an-vortice { to { stroke-dashoffset: -35; } }
@keyframes an-ciuffo { 0%, 100% { transform: translate(0, 0) rotate(-10deg); } 50% { transform: translate(10px, -10px) rotate(14deg); } }
@keyframes an-ruota { to { transform: rotate(360deg); } }
@keyframes an-pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes an-increspa { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.decoro { position: absolute; z-index: 1500; pointer-events: none; }
.decoro svg { display: block; overflow: visible; }
.belino { display: block; transform: translate(-50%, -100%); font: 800 11px/1 var(--f-titoli); background: var(--gesso); border: 1.8px solid var(--notte); border-radius: 999px; padding: 3px 7px 2px; white-space: nowrap; }
.belino.piccolo { font-size: 9px; padding: 2px 5px 1px; }
.zeta { position: absolute; font: 800 11px var(--f-titoli); color: var(--notte); pointer-events: none; z-index: 1500; }

/* Coperta da picnic in prospettiva: le carte ci stanno sopra con il loro spessore */
#piano { position: absolute; z-index: 355; left: 20px; top: 130px; width: 350px; height: 350px; perspective: 640px; perspective-origin: 50% 30%; pointer-events: none; }
#coperta { position: absolute; inset: 0; transform-origin: 50% 100%; transform: rotateX(50deg); transform-style: preserve-3d; border: 3px solid var(--notte); border-radius: 24px;
  /* Tovaglia da picnic a quadri rossi e bianchi: due righe rosse semitrasparenti che si incrociano */
  --rosso-tovaglia: rgba(214, 64, 52, .55);
  background-color: var(--gesso);
  background-image: repeating-linear-gradient(90deg, var(--rosso-tovaglia) 0 25px, transparent 25px 50px),
                    repeating-linear-gradient(0deg, var(--rosso-tovaglia) 0 25px, transparent 25px 50px); }
.pila { position: absolute; width: 74px; height: 104px; transform-style: preserve-3d; pointer-events: auto; cursor: pointer; }
.pila::before { content: ""; position: absolute; inset: 0; transform: translate(var(--ox, 5px), var(--oy, 6px)); background: var(--notte); opacity: var(--oop, .16); border-radius: 7px; }
.strato { position: absolute; inset: 0; background: var(--gesso); border: 1.5px solid var(--notte); border-radius: 6px; }
.strato.cima { border: 0; background: none; }
.strato.cima svg { display: block; width: 100%; height: 100%; }
.vuoto { position: absolute; inset: 0; border: 2.5px dashed var(--notte); border-radius: 7px; opacity: .45; }
.scarto { position: absolute; inset: 0; }
.scarto svg { display: block; width: 100%; height: 100%; }
.dicitura { position: absolute; transform: translateX(-50%); font: 800 13px/1 var(--f-titoli); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--notte);
  background: var(--gesso); border: 2px solid var(--notte); border-radius: 999px; padding: 5px 9px 4px; }
/* Il dado vive su una copia trasparente della tovaglia, un gradino sopra: così mentre rotola non finisce mai "sotto"
   la tovaglia o le carte. Sulla tovaglia vera resta solo la sua ombra. */
#dado-piano { position: absolute; z-index: 356; left: 20px; top: 130px; width: 350px; height: 350px; perspective: 640px; perspective-origin: 50% 30%; pointer-events: none; }
#dado-coperta { position: absolute; inset: 0; transform-origin: 50% 100%; transform: rotateX(50deg); transform-style: preserve-3d; border: 3px solid transparent; }
#dado-base, #dado-pos { position: absolute; left: 150px; top: 218px; width: 48px; height: 48px; }
#dado-pos { transform-style: preserve-3d; pointer-events: auto; cursor: pointer; }
#dado-ombra { position: absolute; inset: 3px; background: var(--notte); border-radius: 10px; }
#dado-ombra-sole { position: absolute; inset: 0; opacity: var(--oop, .16); transform: translate(var(--ox, 6px), var(--oy, 7px)) scale(1.05); }
#dado-salto { position: absolute; inset: 0; transform-style: preserve-3d; }
#dado { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1.15s cubic-bezier(.2,.75,.3,1); }
/* Facce piene: gli angoli fuori dal disegno della faccia sono color inchiostro, come uno spigolo, mai trasparenti */
.fd { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 4px; background: var(--notte); }
.fd svg { display: block; width: 100%; height: 100%; }

/* Carte in mano e carte in volo */
#mano { position: absolute; inset: 0; pointer-events: none; z-index: 2000; }
.cm, .volante { position: absolute; left: 0; top: 0; width: 250px; height: 350px; transform-origin: 50% 50%; }
.cm { pointer-events: auto; touch-action: none; cursor: grab; transition: transform .4s cubic-bezier(.3,1.25,.5,1), filter .3s;
  filter: drop-shadow(0 7px 0 rgba(35,38,74,.22)); }
.cm.attiva { filter: drop-shadow(0 26px 0 rgba(35,38,74,.16)); }
.cm.spenta { filter: drop-shadow(0 7px 0 rgba(35,38,74,.22)) brightness(.93); }
.cm.trascinata { transition: none; cursor: grabbing; filter: drop-shadow(0 30px 0 rgba(35,38,74,.14)); }
.cm svg { display: block; width: 100%; height: 100%; }
.volante { transform-style: preserve-3d; z-index: 3000; pointer-events: none; filter: drop-shadow(0 18px 0 rgba(35,38,74,.16)); }
.faccia { position: absolute; inset: 0; backface-visibility: hidden; }
.faccia svg { display: block; width: 100%; height: 100%; }
.retro { transform: rotateY(180deg); }
#azioni-carta { position: absolute; left: 0; right: 0; top: 628px; display: flex; justify-content: center; gap: 12px; z-index: 2600; }

/* Interfaccia: pulsanti, suggerimenti, fumetti */
.btn { font: 800 13px/1 var(--f-titoli); letter-spacing: .06em; text-transform: uppercase; color: var(--notte); background: var(--gesso);
  border: 2.5px solid var(--notte); border-radius: 14px; box-shadow: 0 4px 0 var(--ombra-pulsante); padding: 10px 14px 9px; cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ombra-pulsante); }
.btn.primario { background: var(--limone); }
.btn:focus-visible { outline: 3px solid var(--notte); outline-offset: 3px; }
#hud { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; z-index: 4000; }
#hud .btn { padding: 8px 12px 7px; font-size: 12px; }
#consiglio { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); z-index: 3900; white-space: nowrap; font: 700 12px/1 var(--f-testo);
  background: var(--gesso); border: 2px solid var(--notte); border-radius: 999px; padding: 6px 12px 5px; transition: opacity .4s; }
/* Menu Opzioni: sotto il pulsante a sinistra, nello stile del pannello di prova */
#opzioni { position: absolute; left: 12px; top: 56px; z-index: 4100; background: var(--gesso); border: 2.5px solid var(--notte); border-radius: 14px;
  box-shadow: 0 6px 0 var(--notte); padding: 12px; display: grid; gap: 9px; width: 210px; }
#opzioni .btn { text-align: left; font-size: 12px; box-shadow: 0 3px 0 var(--ombra-pulsante); }
#opzioni [role=switch][aria-checked="true"] { background: var(--limone); }
#eventi { position: absolute; right: 12px; top: 56px; z-index: 4100; background: var(--gesso); border: 2.5px solid var(--notte); border-radius: 14px;
  box-shadow: 0 6px 0 var(--notte); padding: 12px; display: grid; gap: 9px; width: 230px; }
#eventi .btn { text-align: left; font-size: 12px; box-shadow: 0 3px 0 var(--ombra-pulsante); }
.griglia-eventi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
#eventi .btn.chip { padding: 6px 9px 5px; font-size: 11px; box-shadow: 0 2px 0 var(--ombra-pulsante); }
#eventi .btn.chip.attivo { background: var(--limone); }

/* ---------- Lettura di una carta, fine partita ---------- */
let letturaEl = null;
function apriLettura(id, tenuta) {
  chiudiLettura();
  letturaEl = document.createElement('div'); letturaEl.id = 'lettura';
  letturaEl.innerHTML = `<div class="grande">${cartaSVG(id, true)}</div><span>${tenuta ? 'Lascia per chiudere' : 'Tocca per chiudere'}</span>`;
  letturaEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); chiudiLettura(); });
  ui.appendChild(letturaEl);
  letturaEl.firstChild.animate([{ transform: 'scale(.6) translateY(80px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: RIDOTTO ? 1 : 220, easing: 'cubic-bezier(.3,1.3,.5,1)' });
  nascondiConsiglio(2);
}
function chiudiLettura() { if (letturaEl) { letturaEl.remove(); letturaEl = null; } }
function vittoria(chi) {
  st.finito = true; st.attiva = null; disponiMano();
  const nome = chi === 'io' ? 'Nerina (tu)' : GIOCATORI[chi].nome;
  reagisci(chi, 'festa'); suona('fanfara'); if (chi === 'io') vibra('vittoria');
  for (const g of AREE[chi].agnelli) dopo(() => g.salta(3), rand(0, 500));
  const colori = [P.menta, P.lilla, P.albicocca, P.limone, P.gesso];
  if (!RIDOTTO) for (let i = 0; i < 70; i++) {
    const c = document.createElement('i'); c.className = 'coriandolo'; c.style.background = scegliUno(colori); c.style.left = rand(-20, 400) + 'px'; c.style.top = '-30px'; ui.appendChild(c);
    c.animate([{ transform: `translate(0,0) rotate(0)` }, { transform: `translate(${rand(-60, 60)}px,${rand(700, 900)}px) rotate(${rand(-720, 720)}deg)` }], { duration: rand(2200, 3600), delay: rand(0, 900), easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' }).onfinish = () => c.remove();
  }
  dopo(() => {
    const f = document.createElement('div'); f.id = 'finale';
    f.innerHTML = `<div class="pannello"><h2>Ovile pieno!</h2><p>Vince ${esc(nome)}: ${AREE[chi].posti} agnellini al sicuro prima del buio.</p><button class="btn primario" type="button" id="ancora">Gioca ancora</button></div>`;

/* ---------- Suggerimenti ---------- */
const CONSIGLI = ['Tocca il mazzo per pescare e il dado per tirare', 'Tieni premuta una carta per leggerla', 'Trascina una carta sulla coperta per giocarla', 'Tocca gli agnellini e le pecore'];
let passoConsiglio = 0;
function nascondiConsiglio(fatto) {
  if (st.distribuendo || fatto <= passoConsiglio) return;
  passoConsiglio = fatto;
  const c = $('#consiglio');
  c.style.opacity = 0;
  // Visti tutti: nelle partite dopo, su questo telefono, non compaiono più (finché non si chiede di rivederli)
  if (passoConsiglio >= CONSIGLI.length) { try { localStorage.setItem(CHIAVE_CONSIGLI, '1'); } catch (e) { /* non si salva */ } return; }
  setTimeout(() => { c.textContent = CONSIGLI[passoConsiglio]; c.style.opacity = 1; }, 400);
  if (passoConsiglio === CONSIGLI.length - 1) setTimeout(() => nascondiConsiglio(CONSIGLI.length), 7000);
}
function consigliGiaVisti() { try { return localStorage.getItem(CHIAVE_CONSIGLI) === '1'; } catch (e) { return false; } }
function rivediSuggerimenti() {
  try { localStorage.removeItem(CHIAVE_CONSIGLI); } catch (e) { /* non si salva */ }
  passoConsiglio = 0;
  const c = $('#consiglio'); c.textContent = CONSIGLI[0]; c.style.opacity = 1;
}

    `<button class="btn" type="button" role="switch" aria-checked="${OPZIONI[chiave]}" data-opzione="${chiave}">${testo}: ${OPZIONI[chiave] ? 'sì' : 'no'}</button>`;
  $('#opzioni').innerHTML = riga('suoni', 'Suoni') + (PUO_VIBRARE ? riga('vibrazione', 'Vibrazione') : '') + riga('veloci', 'Animazioni veloci') +
    '<button class="btn" type="button" data-azione="suggerimenti">Rivedi i suggerimenti</button>';
}
function cambiaOpzione(chiave) {
  OPZIONI[chiave] = !OPZIONI[chiave]; salvaOpzioni();
  if (chiave === 'suoni') { if (OPZIONI.suoni) { Suono.accendi(); suona('beee', 1); } else Suono.spegni(); }
  disegnaOpzioni();
}

/* ---------- Avvio e ricomincia ---------- */
function preparaPartita() {
  for (const a of [...AGNELLI]) a.togli();
  for (const a of Object.values(AREE)) { a.agnelli = []; a.mostrati = 0; }
  document.querySelectorAll('#finale, .fumetto, .volante, .pozza, .gelo, .saetta, .lampo, .decoro').forEach((e) => e.remove());
  fermaMeteo(); Object.assign(METEO, { pioggia: 0, grandine: 0, ventoMeta: 0, bagna: false }); cieloTempesta(false); geloErbaMeta = 0; PARTICELLE.length = 0; suona('pioggiaFine');
  for (const el of ELEMENTI_MANO.values()) el.remove(); ELEMENTI_MANO.clear();
  Object.assign(st, { mazzo: 46, guai: 21, pescate: 0, guaiPescati: 0, mano: [], scarti: [], angolo: Object.fromEntries([['io', ['lupo-vegetariano']], ...DISP.avversari.map((a) => [a.id, [...a.angolo]])]),
    maniAvv: Object.fromEntries(DISP.avversari.map((a) => [a.id, a.mano])), attiva: null, finito: false, dadoOccupato: false });
  aggiungiScarto('belato-di-gruppo'); aggiungiScarto('campanaccio-stonato');
  const conti = { io: DISP.agnelli.io, gregge: DISP.agnelli.gregge, ...Object.fromEntries(DISP.avversari.map((a) => [a.id, a.agnelli])) };
  for (const [n, q] of Object.entries(conti)) for (let i = 0; i < q; i++) new Agnello(AREE[n]);
  Object.values(AREE).forEach(aggiornaCartello); aggiornaOra();
  disegnaPile(); TUTTI.forEach(disegnaAngolo); AVVERSARI.forEach(disegnaVentaglio); disponiMano();
}
async function distribuisci() {
  const prima = CODA_PESCATE.slice(); CODA_PESCATE.splice(0, CODA_PESCATE.length, ...MANO_INIZIALE, ...prima);
  st.distribuendo = true;
  for (let i = 0; i < MANO_INIZIALE.length; i++) { await pesca(); await attesa(40); }
  st.distribuendo = false;
  CODA_PESCATE.splice(0, CODA_PESCATE.length, ...prima); st.pescate = 0;
}
async function ricomincia() { preparaPartita(); await attesa(300); distribuisci(); }
function cambiaGiocatori(n) {
  fermaMeteo(); camera.getAnimations().forEach((a) => a.cancel()); inquadrato = null; statoCamera = null;
  costruisciTavolo(n); if (!GIOCATORI[st.bersaglio]) st.bersaglio = 'io';
  ricomincia();
}
// Pannello di prova: si sceglie a chi capita l'evento, poi l'evento
const METEO_PROVA = [['grandine-a-sorpresa', 'Grandine'], ['pioggia-di-traverso', 'Pioggia'], ['vento-dispettoso', 'Vento'], ['nebbia-fitta', 'Nebbia'],
  ['fulmine-curioso', 'Fulmine'], ['gelata-di-agosto', 'Gelata'], ['pozzanghera-senza-fondo', 'Pozzanghera']];
function disegnaPannello() {
  const chi = GIOCATORI[st.bersaglio] ? st.bersaglio : 'io';
  const chip = (attr, val, testo, attivo) => `<button class="btn chip${attivo ? ' attivo' : ''}" type="button" data-${attr}="${val}" aria-pressed="${attivo}">${esc(testo)}</button>`;
  const bottone = (ev, testo) => `<button class="btn" type="button" data-evento="${ev}">${esc(testo)}</button>`;
  $('#eventi').innerHTML =
    `<p>A chi?</p><div class="chips">${TUTTI.map((c) => chip('chi', c, GIOCATORI[c].nome, c === chi)).join('')}</div>` +
    `<p>Cosa gli succede</p>${bottone('furto', 'Gli rubano 2 agnellini')}${bottone('guaio:lupo-vegetariano', 'Prende il Lupo')}` +
    `<p>Guai meteo</p><div class="griglia-eventi">${METEO_PROVA.map(([id, nome]) => bottone('guaio:' + id, nome)).join('')}</div>` +
    `${bottone('beeeno', 'Gioca Beee-NO!')}${bottone('pascolo', 'Pascolo da 5')}` +
    `<p>Partita</p><div class="chips">${[2, 3, 4].map((n) => chip('giocatori', n, `${n} giocatori`, n === numeroGiocatori)).join('')}</div>${bottone('ricomincia', 'Ricomincia')}`;
}

function avvia() {
  disegnaPaesaggio(); creaSole(); creaNuvole(); creaTela(); costruisciTavolo(3);
  creaDado(); preparaPartita(); requestAnimationFrame(ciclo);
  setTimeout(distribuisci, 500);

  $('#mazzo').addEventListener('pointerdown', (e) => { e.stopPropagation(); pesca(); });
  $('#dado-pos').addEventListener('pointerdown', (e) => { e.stopPropagation(); tiraDado(); });
  $('#mazzo-guai').addEventListener('pointerdown', (e) => { e.stopPropagation(); fumetto('io', 'I Guai arrivano da soli…'); });
  const pannello = $('#eventi'), apri = $('#apri-eventi');
  const chiudiEventi = () => { pannello.hidden = true; apri.setAttribute('aria-expanded', 'false'); };
  $('#gioca').addEventListener('click', () => { if (st.attiva) gioca(st.attiva); });
  $('#rimetti').addEventListener('click', () => { st.attiva = null; disponiMano(); });
  $('#azioni-carta').addEventListener('pointerdown', (e) => e.stopPropagation());
  scena.addEventListener('pointerdown', () => { if (st.attiva) { st.attiva = null; disponiMano(); } if (!pannello.hidden) chiudiEventi(); });
  // Qualsiasi tocco sveglia la scena dal riposo
  addEventListener('pointerdown', () => { RISPARMIO.ultimoTocco = performance.now(); RISPARMIO.riposo = false; }, true);
  // Un tocco sul prato durante un evento lo salta; mano, pulsanti e tovaglia fanno quello che fanno sempre
  scena.addEventListener('pointerdown', (e) => {
    if (eventoInCorso() && !inInterfaccia(e.target) && !e.target.closest('#mazzo, #mazzo-guai, #dado-pos, #scarti')) saltaEvento();
  }, true);
  // Menu Opzioni
  const menu = $('#opzioni'), apriOpz = $('#apri-opzioni');
  const chiudiOpzioni = () => { menu.hidden = true; apriOpz.setAttribute('aria-expanded', 'false'); };
  apriOpz.addEventListener('pointerdown', (e) => e.stopPropagation());
  apriOpz.addEventListener('click', () => { if (menu.hidden) disegnaOpzioni(); menu.hidden = !menu.hidden; apriOpz.setAttribute('aria-expanded', String(!menu.hidden)); });
  menu.addEventListener('pointerdown', (e) => e.stopPropagation());
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-opzione]'); if (b) { cambiaOpzione(b.dataset.opzione); return; }
    if (e.target.closest('[data-azione="suggerimenti"]')) { chiudiOpzioni(); rivediSuggerimenti(); }
  });
  scena.addEventListener('pointerdown', () => { if (!menu.hidden) chiudiOpzioni(); });
  // I suoni salvati come accesi partono al primo tocco: i browser non li fanno partire da soli
  if (OPZIONI.suoni) addEventListener('pointerdown', () => { if (OPZIONI.suoni) Suono.accendi(); }, { once: true, capture: true });
  // Suggerimenti sui gesti: solo la prima volta su questo telefono
  if (consigliGiaVisti()) { passoConsiglio = CONSIGLI.length; $('#consiglio').style.opacity = 0; }
  apri.addEventListener('pointerdown', (e) => e.stopPropagation());
  apri.addEventListener('click', () => { if (pannello.hidden) disegnaPannello(); pannello.hidden = !pannello.hidden; apri.setAttribute('aria-expanded', String(!pannello.hidden)); });
  pannello.addEventListener('pointerdown', (e) => e.stopPropagation());
  pannello.addEventListener('click', (e) => {
    const scelta = e.target.closest('[data-chi]');
    if (scelta) { st.bersaglio = scelta.dataset.chi; disegnaPannello(); return; }
    const quanti = e.target.closest('[data-giocatori]');
    if (quanti) { chiudiEventi(); cambiaGiocatori(+quanti.dataset.giocatori); return; }
    const b = e.target.closest('[data-evento]'); if (!b) return; chiudiEventi();
    const ev = b.dataset.evento, chi = GIOCATORI[st.bersaglio] ? st.bersaglio : 'io';
    if (ev === 'furto') rubaA(chi, 2);
    else if (ev.startsWith('guaio:')) guaio(ev.slice(6), chi);
    else if (ev === 'beeeno') beeeNoDi(chi);
    else if (ev === 'pascolo') { if (!st.finito) { fumetto(chi, 'Pascolo 5!'); sposta(5, AREE.gregge, AREE[chi]); } }
    else if (ev === 'ricomincia') ricomincia();
  });
  document.addEventListener('visibilitychange', () => { ultimo = performance.now(); });
}
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), attesaVera(1800)]).then(avvia);
</script>
